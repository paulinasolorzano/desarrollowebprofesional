const FONT_SIZE = 13;
const FONT = `${FONT_SIZE}px "Courier New", monospace`;
const LINE_H = 22;
const PAD_X = 16;
const PAD_Y = 12;

function drawCode(canvasId, lines) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;

  // Medir el ancho máximo con un canvas temporal
  const tmp = document.createElement('canvas');
  const tc = tmp.getContext('2d');
  tc.font = FONT;
  let maxW = 0;
  for (const line of lines) {
    const full = line.map(s => s[1]).join('');
    const w = tc.measureText(full).width;
    if (w > maxW) maxW = w;
  }

  const W = Math.ceil(maxW + PAD_X * 2);
  const H = lines.length * LINE_H + PAD_Y * 2;

  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Fondo blanco
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  ctx.font = FONT;
  ctx.textBaseline = 'alphabetic';

  lines.forEach((segs, i) => {
    const y = PAD_Y + i * LINE_H + LINE_H * 0.75;
    let x = PAD_X;
    for (const [color, text] of segs) {
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      x += tc.measureText(text).width;
    }
  });
}

// Esperar a que la fuente esté lista antes de renderizar
document.fonts.ready.then(() => {
  for (const [id, lines] of Object.entries(bloques)) {
    drawCode(id, lines);
  }
});
